    #crucible-landing-concepts .cl-product{
      --cl-paper:light-dark(#ebede6,#18251e);
      --cl-panel:light-dark(#f8f9f4,#21342a);
      --cl-ink:light-dark(#14281d,#edf1e8);
      --cl-muted:light-dark(#506052,#b6c4b6);
      --cl-green:light-dark(#28513f,#abcab6);
      --cl-on-green:light-dark(#f8f9f4,#172b20);
      --cl-line:light-dark(#c7cdc1,#425648);
      --cl-wash:light-dark(#dce6d5,#2d4536);
      --cl-hover:light-dark(#e3e9dd,#2a4233);
      box-sizing:border-box;position:relative;display:flex;flex-direction:column;
      min-height:690px;width:100%;background:var(--cl-paper);color:var(--cl-ink);
      font:400 15px/1.5 CruciblePreviewSans,'Arial',sans-serif;
      text-align:left;isolation:isolate;
    }
    #crucible-landing-concepts .cl-product *,#crucible-landing-concepts .cl-product *::before,#crucible-landing-concepts .cl-product *::after{box-sizing:border-box}
    #crucible-landing-concepts .cl-product [hidden]{display:none!important}
    #crucible-landing-concepts .cl-product :where(button,input,textarea){font:inherit}
    #crucible-landing-concepts .cl-product button:focus-visible,#crucible-landing-concepts .cl-product input:focus-visible{outline:2px solid var(--cl-green);outline-offset:5px}
    #crucible-landing-concepts .cl-product button:disabled{cursor:default;opacity:.45}
    #crucible-landing-concepts .cl-product h1,#crucible-landing-concepts .cl-product h2,#crucible-landing-concepts .cl-product h3,#crucible-landing-concepts .cl-product p{margin:0}
    #crucible-landing-concepts .cl-header{display:flex;align-items:center;gap:30px;min-height:88px;padding:20px 38px;border-bottom:1px solid var(--cl-line)}
    #crucible-landing-concepts .cl-brand{padding:0;border:0;background:none;color:var(--cl-green);font:400 34px/1 Georgia,'Times New Roman',serif;letter-spacing:-1.4px}
    #crucible-landing-concepts .cl-nav{display:flex;align-items:center;gap:20px;flex:1}
    #crucible-landing-concepts .cl-nav button,#crucible-landing-concepts .cl-quiet{border:0;background:none;color:var(--cl-muted);padding:8px 0;font-size:13px}
    #crucible-landing-concepts .cl-nav button:hover,#crucible-landing-concepts .cl-quiet:hover{color:var(--cl-green);text-decoration:underline;text-underline-offset:4px}
    #crucible-landing-concepts .cl-header-tools{margin-left:auto;display:flex;align-items:center;gap:23px}
    #crucible-landing-concepts .cl-account{display:grid;place-items:center;width:33px;height:33px;border-radius:50%;background:var(--cl-wash);color:var(--cl-green);font-size:11px;letter-spacing:.04em}
    #crucible-landing-concepts .cl-main{flex:1;display:flex;flex-direction:column;justify-content:center;padding:44px 52px}
    #crucible-landing-concepts .cl-home-hero{text-align:center;margin-bottom:36px}
    #crucible-landing-concepts .cl-home-hero h1{font:400 clamp(35px,4.6vw,49px)/1.12 CruciblePreviewSerif,Georgia,serif;letter-spacing:-1.1px}
    #crucible-landing-concepts .cl-home-hero p{color:var(--cl-muted);margin-top:13px;font-size:14px}
    #crucible-landing-concepts .cl-path-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;max-width:760px;width:100%;margin:0 auto}
    #crucible-landing-concepts .cl-path{border:1px solid var(--cl-line);border-radius:12px;background:var(--cl-panel);color:var(--cl-ink);padding:29px;text-align:left;display:flex;flex-direction:column;align-items:flex-start;min-height:185px;gap:12px;transition:background .15s,border-color .15s}
    #crucible-landing-concepts .cl-path:hover{background:var(--cl-hover);border-color:var(--cl-green)}
    #crucible-landing-concepts .cl-path-title{font:400 28px/1.2 CruciblePreviewSerif,Georgia,serif;letter-spacing:-.4px}
    #crucible-landing-concepts .cl-path-copy{font-size:14px;color:var(--cl-muted);max-width:240px}
    #crucible-landing-concepts .cl-path-arrow{margin-top:auto;align-self:flex-end;font-size:23px;line-height:1;color:var(--cl-green)}
    #crucible-landing-concepts .cl-footer{display:flex;align-items:center;justify-content:center;padding:20px 30px 25px;min-height:68px}
    #crucible-landing-concepts .cl-footer button{font-size:12px}
    #crucible-landing-concepts .cl-split-home{display:grid;grid-template-columns:1.05fr 1fr;align-items:center;gap:56px;max-width:850px;margin:0 auto;width:100%}
    #crucible-landing-concepts .cl-split-home h1{font:400 clamp(38px,4.7vw,51px)/1.1 CruciblePreviewSerif,Georgia,serif;letter-spacing:-1.2px}
    #crucible-landing-concepts .cl-split-home .cl-intro-copy{color:var(--cl-muted);font-size:14px;max-width:285px;margin-top:20px}
    #crucible-landing-concepts .cl-stacked-paths{display:grid;gap:16px}
    #crucible-landing-concepts .cl-stacked-paths .cl-path{min-height:151px;padding:25px 27px;border-radius:8px;gap:9px}
    #crucible-landing-concepts .cl-path-featured{background:var(--cl-green);border-color:var(--cl-green);color:var(--cl-on-green)}
    #crucible-landing-concepts .cl-path-featured .cl-path-copy,#crucible-landing-concepts .cl-path-featured .cl-path-arrow{color:var(--cl-on-green)}
    #crucible-landing-concepts .cl-path-featured:hover{background:var(--cl-green);filter:brightness(.95)}
    #crucible-landing-concepts .cl-stacked-paths .cl-path-title{font-size:27px}
    #crucible-landing-concepts .cl-quiet-home{max-width:740px;width:100%;margin:auto}
    #crucible-landing-concepts .cl-quiet-home h1{font:400 clamp(34px,4.2vw,44px)/1.16 CruciblePreviewSerif,Georgia,serif;letter-spacing:-.8px;margin-bottom:37px}
    #crucible-landing-concepts .cl-path-row{display:grid;grid-template-columns:1fr auto;gap:12px 24px;align-items:center;width:100%;padding:28px 2px;border:0;border-top:1px solid var(--cl-line);background:none;color:var(--cl-ink);text-align:left}
    #crucible-landing-concepts .cl-path-row:last-child{border-bottom:1px solid var(--cl-line)}
    #crucible-landing-concepts .cl-path-row:hover .cl-path-title{color:var(--cl-green)}
    #crucible-landing-concepts .cl-path-row .cl-path-title{font-size:31px}
    #crucible-landing-concepts .cl-path-row .cl-path-copy{display:block;max-width:none;margin-top:7px}
    #crucible-landing-concepts .cl-path-row .cl-path-arrow{align-self:center;margin:0;font-size:29px}
    #crucible-landing-concepts .cl-flow{width:100%;max-width:680px;margin:auto;display:flex;flex-direction:column;gap:25px}
    #crucible-landing-concepts .cl-flow-top{display:flex;align-items:center;justify-content:space-between;gap:12px}
    #crucible-landing-concepts .cl-eyebrow{font-size:12px;color:var(--cl-muted);letter-spacing:.02em}
    #crucible-landing-concepts .cl-back{border:0;background:none;padding:5px 0;color:var(--cl-green);font-size:13px}
    #crucible-landing-concepts .cl-back:hover{text-decoration:underline;text-underline-offset:4px}
    #crucible-landing-concepts .cl-progress{display:flex;gap:6px;margin-top:9px}
    #crucible-landing-concepts .cl-progress span{height:3px;flex:1;border-radius:2px;background:var(--cl-line)}
    #crucible-landing-concepts .cl-progress span.cl-done{background:var(--cl-green)}
    #crucible-landing-concepts .cl-flow-heading h1{font:400 clamp(31px,4vw,40px)/1.16 CruciblePreviewSerif,Georgia,serif;letter-spacing:-.7px}
    #crucible-landing-concepts .cl-flow-heading p{margin-top:10px;color:var(--cl-muted);font-size:14px;max-width:520px}
    #crucible-landing-concepts .cl-choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    #crucible-landing-concepts .cl-choice{position:relative;border:1px solid var(--cl-line);border-radius:9px;background:var(--cl-panel);color:var(--cl-ink);padding:21px;text-align:left;display:flex;flex-direction:column;gap:8px;min-height:111px}
    #crucible-landing-concepts .cl-choice:hover{background:var(--cl-hover)}
    #crucible-landing-concepts .cl-choice[aria-pressed=true]{border-color:var(--cl-green);background:var(--cl-wash)}
    #crucible-landing-concepts .cl-choice[aria-pressed=true]::after{content:'✓';position:absolute;right:14px;top:12px;color:var(--cl-green)}
    #crucible-landing-concepts .cl-choice strong{font-weight:500;font-size:16px;padding-right:16px}
    #crucible-landing-concepts .cl-choice small{font-size:13px;color:var(--cl-muted)}
    #crucible-landing-concepts .cl-flow-actions{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-top:2px}
    #crucible-landing-concepts .cl-primary{border:1px solid var(--cl-green);border-radius:6px;background:var(--cl-green);color:var(--cl-on-green);padding:11px 20px;font-size:14px;min-height:44px}
    #crucible-landing-concepts .cl-primary:hover{filter:brightness(.95)}
    #crucible-landing-concepts .cl-detail{border:1px solid var(--cl-line);border-radius:9px;background:var(--cl-panel);padding:24px;min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:15px}
    #crucible-landing-concepts .cl-detail-row{display:flex;align-items:center;gap:13px;font-size:14px}
    #crucible-landing-concepts .cl-step-mark{width:25px;height:25px;display:grid;place-items:center;flex-shrink:0;background:var(--cl-wash);border-radius:50%;font-size:12px;color:var(--cl-green)}
    #crucible-landing-concepts .cl-brief{border-left:2px solid var(--cl-green);padding-left:17px;color:var(--cl-ink);font-size:15px}
    #crucible-landing-concepts .cl-chip{display:inline-flex;align-self:flex-start;padding:4px 9px;background:var(--cl-wash);color:var(--cl-green);font-size:11px;border-radius:4px}
    #crucible-landing-concepts .cl-inputs{display:grid;gap:16px}
    #crucible-landing-concepts .cl-field{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--cl-muted)}
    #crucible-landing-concepts .cl-field input{width:100%;min-width:0;border:1px solid var(--cl-line);border-radius:6px;padding:12px;background:var(--cl-panel);color:var(--cl-ink);font-size:14px}
    #crucible-landing-concepts .cl-field input::placeholder{color:var(--cl-muted);opacity:.8}

  <script>
    (() => {
      const root = document.getElementById('crucible-landing-concepts');
      const products = [...root.querySelectorAll('.cl-product')];
      const homeMarkup = new Map(products.map(product => [product.dataset.concept, product.querySelector('main').innerHTML]));
      const labels = {paths:'Two paths', guided:'A guided start', essential:'Just the essentials'};
      const state = new Map(products.map(product => [product.dataset.concept, {screen:'home', step:0, scheme:null, approach:null, descriptions:true, navigation:false}]));
      const tour = [
        {name:'Notes', title:'Build on an idea.', copy:'Read research, write down a question, or share what you’ve learned.', preview:'notes'},
        {name:'Bounties', title:'Find a question to work on.', copy:'Explore a research task and contribute evidence toward its goal.', preview:'bounties'},
        {name:'New schemes', title:'Bring a new idea.', copy:'Describe your scheme, add evidence, and submit it for review.', preview:'propose'},
        {name:'Scheme map', title:'See how ideas connect.', copy:'Explore the families and assumptions behind the schemes.', preview:'map'},
        {name:'My activity', title:'Pick up where you left off.', copy:'Return to your challenges, notes and proposals in one place.', preview:'activity'}
      ];
      const escape = text => String(text).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
      function remember(product) {
        if (!window.openai?.setWidgetState) return;
        const all = Object.fromEntries([...state.entries()].map(([id,value]) => [id,{...value}]));
        window.openai.setWidgetState({modelContent:{concept:labels[product.dataset.concept],screen:state.get(product.dataset.concept).screen},privateContent:{landingConcepts:all}}).catch(()=>{});
      }
      function flowTop(name, step, count, section='') {
        return `<div><div class="cl-flow-top"><button type="button" class="cl-back" data-action="home">← Home</button><span class="cl-eyebrow">${name} · ${step+1} of ${count}${section?' · '+section:''}</span></div><div class="cl-progress" role="progressbar" aria-label="${name}" aria-valuemin="0" aria-valuemax="${count}" aria-valuenow="${step+1}">${Array.from({length:count},(_,i)=>`<span class="${i<=step?'cl-done':''}"></span>`).join('')}</div></div>`;
      }
      function heading(title,copy='') { return `<div class="cl-flow-heading"><h1>${title}</h1>${copy?`<p>${copy}</p>`:''}</div>`; }
      function choice(group,value,title,copy,selected) {
        return `<button class="cl-choice" type="button" data-choice="${group}" data-value="${value}" aria-pressed="${selected===value}"><strong>${title}</strong><small>${copy}</small></button>`;
      }
      function challengeContent(s) {
        if (s.step===0) return heading('Choose a scheme.','Start with a small challenge to learn the process.')+
          `<div class="cl-choice-grid">${choice('scheme','dh','Diffie–Hellman','Recover a shared key.',s.scheme)}${choice('scheme','rsa','RSA','Recover the challenge secret.',s.scheme)}</div>`;
        if (s.step===1) return heading('How would you like to work?')+
          `<div class="cl-choice-grid">${choice('approach','agent','With an AI agent','Use your coding assistant.',s.approach)}${choice('approach','manual','With my own tools','Download the inputs and work locally.',s.approach)}</div>`;
        if (s.step===2 && s.approach==='agent') return heading('Connect your agent.','Approve a connection, then give your agent the challenge.')+
          `<div class="cl-detail"><div class="cl-detail-row"><span class="cl-step-mark">1</span><span>Approve the agent connection.</span></div><div class="cl-detail-row"><span class="cl-step-mark">2</span><span>Share the challenge brief.</span></div></div>`;
        if (s.step===2) return heading('Get the challenge inputs.','Download your instance and work locally with your preferred tools.')+
          `<div class="cl-detail"><div class="cl-detail-row"><span class="cl-step-mark">1</span><span>Read the challenge instructions.</span></div><div class="cl-detail-row"><span class="cl-step-mark">2</span><span>Download the public inputs.</span></div></div>`;
        if (s.step===3) return heading('Try to recover the secret.','Use your own challenge inputs. Keep the code and method that produced your answer.')+
          `<div class="cl-detail"><span class="cl-chip">${s.scheme==='rsa'?'RSA':'Diffie–Hellman'} · Smallest stage</span><p class="cl-brief">${s.approach==='agent'?'Ask your agent to explore a method, run it locally, and save the result.':'Explore a method, run it locally, and save the result.'}</p></div>`;
        return heading('Submit your result.','Crucible checks your answer against your challenge instance.')+
          `<div class="cl-inputs"><label class="cl-field">Recovered secret<input type="text" placeholder="Your answer" autocomplete="off" aria-label="Example recovered secret"></label><label class="cl-field">Method and source<input type="text" placeholder="How you obtained your answer" autocomplete="off" aria-label="Example method and source"></label></div>`;
      }
      function tourPreview(kind) {
        if(kind==='notes') return `<div class="cl-detail cl-note-preview"><span class="cl-mini-label">Example note · Private draft</span><h2>A question worth exploring</h2><div class="cl-note-lines" aria-hidden="true"><span></span><span></span><span></span></div></div>`;
        if(kind==='bounties') return `<div class="cl-detail"><span class="cl-mini-label">Example research task</span><h2 class="cl-topic-title">Make an estimate more precise</h2><p class="cl-mini-label">A clear question. Evidence others can check.</p></div>`;
        if(kind==='propose') return `<div class="cl-detail"><span class="cl-mini-label">Proposing a scheme</span><div class="cl-route-diagram"><span>Your idea</span><b aria-hidden="true">→</b><span>Evidence</span><b aria-hidden="true">→</b><span>Review</span></div></div>`;
        if(kind==='map') return `<div class="cl-detail"><span class="cl-mini-label">Related ideas</span><div class="cl-map-preview"><div class="cl-map-family"><strong>Diffie–Hellman</strong><small>Discrete-log family</small></div><div class="cl-map-family"><strong>RSA</strong><small>Integer-based family</small></div></div></div>`;
        return `<div class="cl-detail"><div class="cl-detail-row"><span class="cl-step-mark" aria-hidden="true">→</span><span>Your challenges</span></div><div class="cl-detail-row"><span class="cl-step-mark" aria-hidden="true">→</span><span>Your notes and proposals</span></div></div>`;
      }
      function render(product, moveFocus=false) {
        const s=state.get(product.dataset.concept);
        const main=product.querySelector('main');
        product.classList.toggle('cl-no-descriptions',!s.descriptions);
        product.querySelector('.cl-nav').hidden=!s.navigation;
        product.querySelector('footer').hidden=s.screen!=='home';
        if(s.screen==='home') main.innerHTML=homeMarkup.get(product.dataset.concept);
        else if(s.screen==='challenge') {
          const blocked=(s.step===0&&!s.scheme)||(s.step===1&&!s.approach);
          main.innerHTML=`<div class="cl-flow">${flowTop('Challenge guide',s.step,5)}${challengeContent(s)}<div class="cl-flow-actions">${s.step?'<button class="cl-back" type="button" data-action="previous">← Back</button>':'<span></span>'}<button class="cl-primary" type="button" data-action="${s.step===4?'finish':'next'}" ${blocked?'disabled':''}>${s.step===4?'Finish guide':'Continue →'}</button></div></div>`;
        } else if(s.screen==='tour') {
          const current=tour[s.step];
          main.innerHTML=`<div class="cl-flow">${flowTop('Tour',s.step,tour.length,current.name)}${heading(current.title,current.copy)}${tourPreview(current.preview)}<div class="cl-flow-actions">${s.step?'<button class="cl-back" type="button" data-action="previous">← Back</button>':'<span></span>'}<button class="cl-primary" type="button" data-action="${s.step===tour.length-1?'finish':'next'}">${s.step===tour.length-1?'Finish tour':'Next →'}</button></div></div>`;
        } else if(s.screen==='finished') {
          main.innerHTML=`<div class="cl-flow">${heading('You’ve found your starting point.','Try a challenge, or explore an idea that interests you.')}<div class="cl-flow-actions"><button class="cl-back" type="button" data-action="home">← Home</button><button class="cl-primary" type="button" data-action="workspace">Explore the workspace →</button></div></div>`;
        } else {
          main.innerHTML=`<div class="cl-flow"><button class="cl-back" type="button" data-action="home">← Home</button>${heading('Your workspace.')}<div class="cl-workspace-list"><button class="cl-workspace-link" type="button" data-action="schemes">Schemes <span aria-hidden="true">→</span></button><button class="cl-workspace-link" type="button" data-action="bounties">Bounties <span aria-hidden="true">→</span></button><button class="cl-workspace-link" type="button" data-action="notes">Notes <span aria-hidden="true">→</span></button><button class="cl-workspace-link" type="button" data-action="propose">Propose a scheme <span aria-hidden="true">→</span></button><button class="cl-workspace-link" type="button" data-action="activity">My activity <span aria-hidden="true">→</span></button></div></div>`;
        }
        if(moveFocus) {
          const target=main.querySelector('button:not(:disabled),input');
          target?.focus({preventScroll:true});
        }
      }
      products.forEach(product=>{
        product.addEventListener('click',event=>{
          const button=event.target.closest('button');
          if(!button||button.disabled)return;
          const s=state.get(product.dataset.concept);
          if(button.dataset.choice){s[button.dataset.choice]=button.dataset.value;render(product);product.querySelector(`[data-choice="${button.dataset.choice}"][data-value="${button.dataset.value}"]`)?.focus({preventScroll:true});remember(product);return;}
          const action=button.dataset.action;
          if(!action)return;
          if(action==='home'){s.screen='home';s.step=0;}
          else if(action==='challenge'||action==='schemes'){s.screen='challenge';s.step=0;}
          else if(action==='tour'){s.screen='tour';s.step=0;}
          else if(action==='next')s.step+=1;
          else if(action==='previous')s.step=Math.max(0,s.step-1);
          else if(action==='finish')s.screen='finished';
          else if(action==='workspace')s.screen='workspace';
          else {s.screen='tour';s.step={notes:0,bounties:1,propose:2,activity:4}[action]??0;}
          render(product,true);remember(product);
        });
        render(product);
        if(globalThis.Tweak){
          const editable=state.get(product.dataset.concept);
          const tweak=new Tweak({container:product,onChange:()=>{render(product);remember(product);}});
          tweak.addToggle(editable,'descriptions',{label:'One-line descriptions'});
          tweak.addToggle(editable,'navigation',{label:'Show workspace navigation'});
        }
      });
      function restore(saved){
        if(!saved||typeof saved!=='object')return;
        const values=saved.privateContent?.landingConcepts;
        if(!values)return;
        products.forEach(product=>{
          const incoming=values[product.dataset.concept];
          if(!incoming)return;
          const s=state.get(product.dataset.concept);
          if(['home','challenge','tour','finished','workspace'].includes(incoming.screen))s.screen=incoming.screen;
          if(Number.isInteger(incoming.step)&&incoming.step>=0&&incoming.step<5)s.step=incoming.step;
          if(['dh','rsa',null].includes(incoming.scheme))s.scheme=incoming.scheme;
          if(['agent','manual',null].includes(incoming.approach))s.approach=incoming.approach;
          if(typeof incoming.descriptions==='boolean')s.descriptions=incoming.descriptions;
          if(typeof incoming.navigation==='boolean')s.navigation=incoming.navigation;
          if(s.screen==='challenge'&&s.step>=2&&!s.approach)s.step=1;
          if(s.screen==='challenge'&&s.step>=1&&!s.scheme)s.step=0;
          render(product);
        });
      }
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
    })();
  </script>
