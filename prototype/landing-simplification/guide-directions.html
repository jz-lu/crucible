    #crucible-guide-directions .og-nav{display:flex;gap:21px;flex:1}
    #crucible-guide-directions .og-nav button,#crucible-guide-directions .og-text{border:0;background:none;padding:7px 0;font-size:13px;color:var(--og-muted)}
    #crucible-guide-directions .og-nav button:hover,#crucible-guide-directions .og-text:hover{color:var(--og-green);text-decoration:underline;text-underline-offset:4px}
    #crucible-guide-directions .og-account{display:flex;align-items:center;gap:20px;margin-left:auto}
    #crucible-guide-directions .og-avatar{width:30px;height:30px;display:grid;place-items:center;border-radius:50%;background:var(--og-wash);font-size:11px;color:var(--og-green)}
    #crucible-guide-directions .og-scene{position:relative;flex:1;min-height:626px;padding:38px 40px 190px}
    #crucible-guide-directions .og-product[data-screen=home] .og-scene{display:flex;align-items:center;justify-content:center;padding:46px 46px 30px}
    #crucible-guide-directions .og-home{width:100%;max-width:760px;margin:auto}
    #crucible-guide-directions .og-hero{text-align:center;margin-bottom:35px}
    #crucible-guide-directions .og-hero h1{font:400 clamp(34px,4.8vw,49px)/1.15 GuideSerif,Georgia,serif;letter-spacing:-1px}
    #crucible-guide-directions .og-hero p{margin-top:14px;color:var(--og-muted);font-size:14px}
    #crucible-guide-directions .og-paths{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    #crucible-guide-directions .og-path{display:flex;flex-direction:column;gap:13px;min-width:0;min-height:180px;text-align:left;padding:27px;border:1px solid var(--og-line);border-radius:10px;background:var(--og-panel)}
    #crucible-guide-directions .og-path:hover{background:var(--og-wash);border-color:var(--og-green)}
    #crucible-guide-directions .og-path strong{font:400 29px/1.2 GuideSerif,Georgia,serif;letter-spacing:-.4px}
    #crucible-guide-directions .og-path small{font-size:14px;color:var(--og-muted);max-width:250px}
    #crucible-guide-directions .og-path .og-arrow{align-self:flex-end;margin-top:auto;color:var(--og-green);font-size:24px;line-height:1}
    #crucible-guide-directions .og-explore{text-align:center;margin-top:28px}
    #crucible-guide-directions .og-footer{min-height:60px;padding:12px 34px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;color:var(--og-muted);font-size:12px}
    #crucible-guide-directions .og-footer .og-text{font-size:12px}
    #crucible-guide-directions .og-workspace{position:relative;max-width:760px;margin:0 auto}
    #crucible-guide-directions .og-page-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}
    #crucible-guide-directions .og-page-heading h1{font:400 37px/1.15 GuideSerif,Georgia,serif;letter-spacing:-.7px}
    #crucible-guide-directions .og-page-heading p{font-size:13px;color:var(--og-muted);margin-top:8px}
    #crucible-guide-directions .og-button{border:1px solid var(--og-green);border-radius:6px;padding:10px 17px;background:var(--og-green);color:var(--og-on-green)!important;font-size:13px;min-height:43px;text-align:center}
    #crucible-guide-directions .og-button:hover{filter:brightness(.95)}
    #crucible-guide-directions .og-table-head{display:grid;grid-template-columns:1.2fr 1fr;gap:20px;padding:0 18px 12px;font-size:11px;color:var(--og-muted);border-bottom:1px solid var(--og-line)}
    #crucible-guide-directions .og-scheme{display:grid;grid-template-columns:1.2fr 1fr;align-items:center;gap:20px;width:100%;padding:24px 18px;border:0;border-bottom:1px solid var(--og-line);background:none;text-align:left}
    #crucible-guide-directions .og-scheme strong{font:400 26px/1.15 GuideSerif,Georgia,serif}
    #crucible-guide-directions .og-scheme span{font-size:13px;color:var(--og-muted)}
    #crucible-guide-directions .og-scheme:hover{background:var(--og-wash)}
    #crucible-guide-directions .og-guiding .og-scheme:not(.og-target):hover{background:none}
    #crucible-guide-directions .og-stages{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin:0 0 24px}
    #crucible-guide-directions .og-stages span{font-size:12px;color:var(--og-muted);margin-right:6px}
    #crucible-guide-directions .og-stage{display:grid;place-items:center;width:36px;height:36px;border:1px solid var(--og-line);border-radius:5px;background:var(--og-panel);font-size:13px}
    #crucible-guide-directions .og-stage[aria-pressed=true]{background:var(--og-green);border-color:var(--og-green);color:var(--og-on-green)}
    #crucible-guide-directions .og-tabs{display:flex;gap:28px;border-bottom:1px solid var(--og-line);padding-bottom:10px;margin-bottom:30px;color:var(--og-muted);font-size:13px}
    #crucible-guide-directions .og-tabs strong{color:var(--og-green);font-weight:500;border-bottom:2px solid var(--og-green);padding-bottom:10px;margin-bottom:-11px}
    #crucible-guide-directions .og-ready{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:25px;border:1px solid var(--og-line);border-radius:8px;background:var(--og-panel)}
    #crucible-guide-directions .og-ready h2{font:400 29px/1.2 GuideSerif,Georgia,serif}

  </style>
  <div class="viz-carousel" aria-label="Crucible landing and interactive guide directions">
    <section data-variant="Spotlight" aria-label="Spotlight concept">
      <div class="og-product og-spotlight og-motion" data-concept="spotlight" data-screen="home" aria-label="Spotlight design"></div>
    </section>
    <section data-variant="Margin notes" aria-label="Margin notes concept" hidden>
      <div class="og-product og-margin og-motion" data-concept="margin" data-screen="home" aria-label="Margin notes design"></div>
    </section>
    <section data-variant="Side companion" aria-label="Side companion concept" hidden>
      <div class="og-product og-companion og-motion" data-concept="companion" data-screen="home" aria-label="Side companion design"></div>
    </section>
  </div>
  <script>
    (()=>{
      const root=document.getElementById('crucible-guide-directions');
      const products=[...root.querySelectorAll('.og-product')];
      const names={spotlight:'Spotlight',margin:'Margin notes',companion:'Side companion'};
      const animationTimers=new WeakMap();
      let snapshotRevision=0;
      const states=new Map(products.map(p=>[p.dataset.concept,{screen:'home',path:null,scheme:'Diffie–Hellman',stage:1,feature:'note',title:'',summary:'',motion:true,navigation:false}]));
      const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
      const button=(label,action,cls='og-text',extra='')=>`<button type="button" class="${cls} cursor-interaction" data-action="${action}" ${extra}>${label}</button>`;
      function header(s){return `<header class="og-header">${button('<span class="og-mark" aria-hidden="true"></span><span>crucible</span>','home','og-brand','aria-label="Crucible home"')}<nav class="og-nav" aria-label="Workspace navigation" ${s.screen==='home'&&!s.navigation?'hidden':''}>${button('Schemes','catalogue')}${button('Bounties','bounties')}${button('Notes','notes')}</nav><div class="og-account">${button('My activity','features')}<span class="og-avatar" aria-label="Signed in">CL</span></div></header>`;}
      function home(concept){
        const copy=concept==='margin'?['Find your starting point.','A place to explore and test cryptographic ideas.']:concept==='companion'?['A small step.<br>A new idea.','Try something. We’ll show you how.']:['Welcome to Crucible.','Explore cryptography. Start with something small.'];
        return `<div class="og-home"><div class="og-hero"><h1>${copy[0]}</h1><p>${copy[1]}</p></div><div class="og-paths">${button('<strong>Try a challenge</strong><small>Test a scheme, one step at a time.</small><span class="og-arrow" aria-hidden="true">→</span>','catalogue','og-path')}${button('<strong>Explore & contribute</strong><small>Notes, bounties and new schemes.</small><span class="og-arrow" aria-hidden="true">→</span>','features','og-path')}</div><p class="og-explore">${button('Explore on my own →','catalogue')}</p></div>`;
      }
      const heading=(title,copy='',action='')=>`<div class="og-page-heading"><div><h1>${title}</h1>${copy?`<p>${copy}</p>`:''}</div>${action}</div>`;
      function workspace(s){
        if(s.screen==='catalogue')return heading('Schemes','Choose a construction to explore.')+`<div class="og-table-head"><span>Scheme</span><span>Family</span></div>${button('<strong>Diffie–Hellman</strong><span>Discrete logarithms <span aria-hidden="true">→</span></span>','scheme-dh','og-scheme','data-guide-anchor="scheme"')}${button('<strong>RSA</strong><span>Integer factorization <span aria-hidden="true">→</span></span>','scheme-rsa','og-scheme')}`;
        if(s.screen==='challenge'||s.screen==='inputs'){
          const stages=`<div class="og-stages"><span>Challenge stage</span>${[1,2,3,4,5].map(n=>button(n,'stage-'+n,'og-stage',`aria-label="Stage ${n}" aria-pressed="${s.stage===n}"`)).join('')}</div>`;
          const ready=s.screen==='challenge'?`<div class="og-ready"><div><h2>Ready?</h2><p>Recover the shared secret from your instance.</p></div>${button('Get instance →','get-instance','og-button','data-guide-anchor="instance"')}</div>`:`<div class="og-details"><h2>Your challenge workspace.</h2><p>Bring your coding assistant, or use your own tools.</p><div class="og-tools">${button('Use with an agent →','agent','og-button','data-guide-anchor="tools"')}${button('Manual tools ↓','manual','og-button','data-guide-anchor="manual-tools"')}</div>${s.approach?`<p class="og-label">${s.approach==='agent'?'Copy the prompt to your agent, then approve its connection.':'Download challenge JSON and work locally.'}</p>`:''}</div>`;
          return heading(esc(s.scheme),`Stage ${s.stage}`)+stages+`<div class="og-tabs"><span>Record</span><strong>Challenge</strong><span>Protocol</span></div>`+ready;
        }
        if(s.screen==='features')return heading('Where would you like to start?')+`<div class="og-choices">${button('<span><strong>Write a note</strong><small>Develop a question or share an idea.</small></span><span aria-hidden="true">→</span>','notes','og-choice','data-guide-anchor="feature"')}${button('<span><strong>Contribute to a bounty</strong><small>Work on a focused research question.</small></span><span aria-hidden="true">→</span>','bounties','og-choice')}${button('<span><strong>Propose a scheme</strong><small>Bring a construction for review.</small></span><span aria-hidden="true">→</span>','proposal','og-choice')}</div>`;
        if(s.screen==='notes')return heading('Notes','Questions, arguments and ideas.',button('New note →','editor','og-button','data-guide-anchor="new-note"'))+`<div class="og-note-empty">A private draft is a good place to begin.</div>`;
        if(s.screen==='editor'||s.screen==='proposal')return heading(s.screen==='proposal'?'New proposal note':'New private note','Start with the idea. Your draft stays private.')+`<div class="og-form"><label class="og-field">Title<input data-field="title" data-guide-anchor="title" maxlength="160" value="${esc(s.title)}" placeholder="What would you like to explore?" autocomplete="off"></label><label class="og-field">Dropdown summary<textarea data-field="summary" data-guide-anchor="summary" maxlength="700" placeholder="What is the question or result, and why does it matter?">${esc(s.summary)}</textarea></label></div>`;
        if(s.screen==='bounties')return heading('Bounties','Find a question worth working on.')+`<div class="og-choices">${button('<span><strong>Reproduce a reference attack</strong><small>Explore the method and its evidence.</small></span><span aria-hidden="true">→</span>','bounty','og-choice','data-guide-anchor="bounty"')}</div>`;
        if(s.screen==='bounty')return heading('Reproduce a reference attack')+`<div class="og-details"><h2>What counts as completion?</h2><p>A reproducible account of the method, with evidence others can inspect.</p>${button('Link a contribution →','contribution','og-button','data-guide-anchor="contribute"')}</div>`;
        return heading('Link your contribution','Use an exact published note revision.')+`<div class="og-form"><label class="og-field">Exact contribution-note citation<textarea data-guide-anchor="citation" placeholder="Paste the citation from your published note"></textarea></label><label class="og-field">What does it establish?<textarea placeholder="Explain how your work addresses the task"></textarea></label></div>`;
      }
      function instruction(s){
        if(s.screen==='catalogue')return {anchor:'scheme',title:'Start here.',copy:'Choose a scheme. Diffie–Hellman is a simple place to begin.',step:'1 of 3'};
        if(s.screen==='challenge')return {anchor:'instance',title:'Make it yours.',copy:'Get an instance to work on. We’ve started you at the first stage.',step:'2 of 3'};
        if(s.screen==='inputs')return {anchor:s.approach==='manual'?'manual-tools':'tools',title:s.approach==='manual'?'Your tools, your pace.':'Choose how to work.',copy:s.approach==='manual'?'Open Manual tools to download your public inputs.':'Use an agent, or open Manual tools to work locally.',step:'3 of 3'};
        if(s.screen==='features')return {anchor:'feature',title:'Follow an idea.',copy:'Choose a way to contribute. A note is a good first step.',step:'1 of 3'};
        if(s.screen==='notes')return {anchor:'new-note',title:'An idea starts here.',copy:'Open a private note. You can develop it before sharing.',step:'2 of 3'};
        if(s.screen==='editor'||s.screen==='proposal')return {anchor:s.title.trim()?'summary':'title',title:s.title.trim()?'Why does it matter?':'Give it a name.',copy:s.title.trim()?'Add a short summary so others can see the question.':'Write a short title for the idea you want to explore.',step:'3 of 3'};
        if(s.screen==='bounties')return {anchor:'bounty',title:'Find a question.',copy:'Open a bounty to read its scope and completion criteria.',step:'2 of 3'};
        if(s.screen==='bounty')return {anchor:'contribute',title:'Bring your evidence.',copy:'Link a published note that addresses this task.',step:'3 of 3'};
        return {anchor:'citation',title:'Pin the exact note.',copy:'Use its revision and content hash so the evidence stays clear.',step:'3 of 3'};
      }
      function remember(product){
        if(!window.openai?.setWidgetState)return;
        const s=states.get(product.dataset.concept);
        snapshotRevision+=1;
        window.openai.setWidgetState({modelContent:{concept:names[product.dataset.concept],screen:s.screen,path:s.path,stage:s.stage,approach:s.approach||null,motion:s.motion},privateContent:{guideDirections:Object.fromEntries(states),revision:snapshotRevision}}).catch(()=>{});
      }
      function position(product,animate=false){
        if(product.closest('[hidden]')||product.dataset.screen==='home')return;
        const scene=product.querySelector('.og-scene'),coach=product.querySelector('.og-coach'),target=product.querySelector('[data-guide-anchor="'+instruction(states.get(product.dataset.concept)).anchor+'"]');
        if(!scene||!coach||!target)return;
        product.querySelectorAll('.og-target').forEach(el=>el.classList.remove('og-target'));target.classList.add('og-target');
        const area=scene.getBoundingClientRect(),body=product.querySelector('.og-workspace').getBoundingClientRect(),rect=target.getBoundingClientRect();
        const side=product.dataset.concept==='companion'&&area.width>540;
        if(!side&&product.dataset.concept!=='companion'){
          const left=product.dataset.concept==='margin'?Math.max(24,body.left-area.left+14):Math.min(area.width-coach.offsetWidth-26,Math.max(24,rect.left-area.left+rect.width*.28));
          const top=Math.max(body.bottom-area.top+38,rect.bottom-area.top+48);
          coach.style.left=left+'px';coach.style.top=top+'px';
        }
        const tip=coach.getBoundingClientRect();
        const end={x:rect.right-area.left+9,y:rect.top-area.top+rect.height/2};
        const start=side?{x:tip.left-area.left-4,y:tip.top-area.top+tip.height*.53}:{x:tip.right-area.left-12,y:tip.top-area.top-5};
        const outside=Math.min(area.width-12,Math.max(end.x+22,start.x+30));
        const path=side?`M ${start.x} ${start.y} C ${start.x-60} ${start.y}, ${end.x+60} ${end.y}, ${end.x} ${end.y}`:`M ${start.x} ${start.y} C ${outside} ${start.y-8}, ${outside} ${end.y}, ${end.x} ${end.y}`;
        const svg=scene.querySelector('.og-connector');
        svg.querySelector('path').setAttribute('d',path);
        const [a,b]=svg.querySelectorAll('line');
        for(const [line,dy]of [[a,-5],[b,5]]){line.setAttribute('x1',end.x+8);line.setAttribute('y1',end.y+dy);line.setAttribute('x2',end.x);line.setAttribute('y2',end.y);}
        if(animate){
          clearTimeout(animationTimers.get(product));product.classList.add('og-action');animationTimers.set(product,setTimeout(()=>product.classList.remove('og-action'),4600));
          svg.classList.remove('og-new');void svg.getBoundingClientRect();svg.classList.add('og-new');setTimeout(()=>svg.classList.remove('og-new'),850);
        }
      }
      function render(product,animate=false){
        const s=states.get(product.dataset.concept),active=s.screen!=='home';
        product.dataset.screen=s.screen;product.classList.toggle('og-guiding',active);product.classList.toggle('og-motion',s.motion);product.classList.toggle('og-no-motion',!s.motion);
        if(!animate)product.classList.remove('og-action');
        const tip=active?instruction(s):null;
        product.innerHTML=header(s)+`<main class="og-scene">${active?`<div class="og-workspace">${workspace(s)}</div><div class="og-screen-veil" aria-hidden="true"></div><aside class="og-coach" aria-label="Guide"><p class="og-coach-label">${product.dataset.concept==='margin'?'A little guidance':'Your guide'} · ${tip.step}</p><h2>${tip.title}</h2><p class="og-coach-copy">${tip.copy}</p></aside><svg class="og-connector" aria-hidden="true"><path class="og-lead" pathLength="1"></path><line></line><line></line></svg>`:home(product.dataset.concept)}</main><footer class="og-footer">${button(active?'← Back':'','back','og-text',active?'':'hidden')}<span></span>${button(active?'Leave guide':'','home','og-text',active?'':'hidden')}</footer>`;
        product.querySelector('.og-coach')?.setAttribute('aria-live','polite');
        requestAnimationFrame(()=>{position(product,animate);if(animate)product.querySelector(active?'[data-guide-anchor="'+tip.anchor+'"]':'.og-brand')?.focus({preventScroll:true});});
      }
      products.forEach(product=>{
        product.addEventListener('click',event=>{
          const control=event.target.closest('[data-action]');if(!control||control.disabled)return;
          const s=states.get(product.dataset.concept),action=control.dataset.action;
          if(action==='home'){s.screen='home';s.path=null;}
          else if(action==='back'){
            s.screen=({catalogue:'home',challenge:'catalogue',inputs:'challenge',features:'home',notes:'features',editor:'notes',proposal:'features',bounties:'features',bounty:'bounties',contribution:'bounty'})[s.screen]||'home';
          }else if(action==='scheme-dh'||action==='scheme-rsa'){s.scheme=action==='scheme-rsa'?'RSA':'Diffie–Hellman';s.screen='challenge';s.path='challenge';s.stage=1;}
          else if(action==='get-instance')s.screen='inputs';
          else if(action==='agent'||action==='manual')s.approach=action;
          else if(action.startsWith('stage-'))s.stage=Number(action.slice(6));
          else if(['catalogue','features','notes','editor','bounties','bounty','contribution','proposal'].includes(action)){s.screen=action;if(action==='catalogue')s.path='challenge';if(action==='features')s.path='contribute';}
          render(product,true);remember(product);
        });
        product.addEventListener('input',event=>{
          const field=event.target.dataset.field;if(!['title','summary'].includes(field))return;
          const s=states.get(product.dataset.concept),was=Boolean(s.title.trim());s[field]=event.target.value;
          if(field==='title'&&was!==Boolean(s.title.trim())){
            const tip=instruction(s),coach=product.querySelector('.og-coach');coach.querySelector('h2').textContent=tip.title;coach.querySelector('.og-coach-copy').textContent=tip.copy;
            position(product,true);
          }
          remember(product);
        });
        render(product);
        if(globalThis.Tweak){const s=states.get(product.dataset.concept);const tweaks=new Tweak({container:product,onChange:()=>{render(product);remember(product);}});tweaks.addToggle(s,'motion',{label:'Animate guidance'});tweaks.addToggle(s,'navigation',{label:'Show navigation on landing'});}
      });
      function restore(saved){
        const all=saved?.privateContent?.guideDirections;if(!all)return;
        const revision=saved.privateContent.revision;
        if(Number.isSafeInteger(revision)){if(revision<=snapshotRevision)return;snapshotRevision=revision;}
        products.forEach(product=>{const incoming=all[product.dataset.concept];if(!incoming)return;const s=states.get(product.dataset.concept);
          const previous=JSON.stringify(s);
          if(['home','catalogue','challenge','inputs','features','notes','editor','bounties','bounty','contribution','proposal'].includes(incoming.screen))s.screen=incoming.screen;
          if(['challenge','contribute',null].includes(incoming.path))s.path=incoming.path;
          if(['Diffie–Hellman','RSA'].includes(incoming.scheme))s.scheme=incoming.scheme;
          if(Number.isInteger(incoming.stage)&&incoming.stage>=1&&incoming.stage<=5)s.stage=incoming.stage;
          for(const key of ['title','summary'])if(typeof incoming[key]==='string')s[key]=incoming[key].slice(0,1200);
          for(const key of ['motion','navigation'])if(typeof incoming[key]==='boolean')s[key]=incoming[key];
          if(['agent','manual'].includes(incoming.approach))s.approach=incoming.approach;
          if(previous!==JSON.stringify(s))render(product);
        });
      }
      restore(window.openai?.widgetState);
      window.addEventListener('openai:set_globals',event=>restore(event.detail?.globals?.widgetState));
      const resize=new ResizeObserver(()=>products.forEach(product=>position(product)));resize.observe(root);
      document.fonts?.ready.then(()=>products.forEach(product=>position(product)));
      const changes=new MutationObserver(records=>{
        for(const record of records)if(record.target.hasAttribute('data-variant')&&!record.target.hidden){record.target.querySelector('.og-product')?.classList.remove('og-action');record.target.querySelector('.og-connector')?.classList.remove('og-new');}
        products.forEach(product=>position(product));
      });changes.observe(root.querySelector('.viz-carousel'),{attributes:true,subtree:true,attributeFilter:['hidden']});
    })();
  </script>
</div>
