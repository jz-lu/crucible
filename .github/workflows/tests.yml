name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  portable-source-checks:
    name: Portable source checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13', '3.14']
    env:
      CRUCIBLE_ENV: development
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set isolated runtime directories
        shell: bash
        run: |
          printf '%s\n' "CRUCIBLE_DATA_DIR=$RUNNER_TEMP/crucible-source-checks" "PYTHONPYCACHEPREFIX=$RUNNER_TEMP/crucible-pycache" >> "$GITHUB_ENV"
      - name: Install pinned Python dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Compile Python sources
        run: python -m compileall -q crucible scripts migrations tests
      - name: Check fresh database migrations
        run: |
          python -m crucible.manage migrate
          python -m alembic check
      - name: Run explicitly portable Python tests
        # This is deliberately not the complete backend/native suite.
        run: >-
          python -m pytest -q
          tests/test_calibration.py
          tests/test_calibration_v2.py
          tests/test_classical_frontier_audit.py
          tests/test_cli.py
          tests/test_kem.py
          tests/test_module_compressed_v4_core.py
          tests/test_mlkem_correctness_certificate.py
          tests/test_common_correctness_policy.py
          tests/test_exact_parameters.py
          tests/test_beta_invitations.py
          tests/test_beta_operator.py
          tests/test_beta_preflight.py
          tests/test_beta_release_policy.py
          tests/test_beta_migration.py
          tests/test_beta_transfer.py
          tests/test_beta_release_baselines.py
          tests/test_implementation_builds.py
          tests/test_app_platform.py
          tests/test_app_platform_backup.py
          tests/test_dependency_lock.py
          tests/test_db_pool.py
          tests/test_loading_projections.py
          tests/test_sntrup_builder.py
          tests/test_ntru_linux_builder.py
          tests/test_github_auth.py
          tests/test_password_recovery.py
          tests/test_password_recovery_races.py
          tests/test_release_pipeline.py
      - name: Run all standalone frontend regressions
        run: |
          node --version
          for test in tests/test_*.cjs; do
            node "$test"
          done
      - name: State verification boundary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## Portable source checks only
          This job checks compilation, migrations, the explicitly listed source-only
          Python tests, and all standalone JavaScript regressions. It does not build
          or validate the registered native cryptographic workers.

          The separate manual Release beta workflow validates the exact reviewed
          Linux AMD64 image, every registered scheme manifest and its selected
          native application regression suites before publication. See
          docs/releasing-beta.txt for the precise scope. This portable job does not
          bypass native pins or claim full native/backend verification.
          EOF
  release-contract:
    name: Reviewed runtime source contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -B deploy/release.py contract
  browser-checks:
    name: Real Chromium UI and private-access checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/browser/package-lock.json
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements.lock
          npm ci --prefix tests/browser --ignore-scripts --no-audit --no-fund
      - name: Install locked Chromium
        working-directory: tests/browser
        run: npx --no-install playwright install --with-deps chromium
      - name: Run disposable loopback browser checks
        working-directory: tests/browser
        run: npm test
      - name: Retain synthetic browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: synthetic-browser-failures
          path: |
            tests/browser/playwright-report
            tests/browser/test-results
          retention-days: 7
      - name: State browser verification boundary
        if: always()
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Browser checks use the actual app, static assets, session/membership
          checks and notebook handlers on disposable SQLite. A test-only portable
          DH catalogue avoids native build dependencies. This does not test the
          hosted beta, PostgreSQL, OAuth/mail providers or native KEM workers.
          There are no test retries or skips. Only synthetic failure traces are saved.
          EOF
  metadata-postgresql:
    name: SQLite and PostgreSQL 17 metadata-query parity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Exact official AMD64 PostgreSQL 17 image used by the transfer rehearsal.
        image: postgres@sha256:3518071376d0b6156b02e1db2747a78511b5b9dc3763cc79c506ebe2dc2ee71c
        env:
          POSTGRES_USER: crucible_metadata
          POSTGRES_PASSWORD: synthetic-only
          POSTGRES_DB: crucible_metadata_test
        ports:
          - 127.0.0.1:5433:5432
        options: >-
          --health-cmd "pg_isready -U crucible_metadata -d crucible_metadata_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      CRUCIBLE_METADATA_POSTGRES: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
      - name: Compare fresh synthetic metadata and scoring queries
        run: python -m pytest -q tests/test_metadata_relations.py
      - name: State verification boundary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          Actual SQLite and PostgreSQL 17 queries compare the optimized typed
          metadata relation with the previous VALUES implementation, including
          score/milestone parity and malformed receipt tiers. The PostgreSQL
          connection is fixed to this disposable loopback service. This job
          neither reads deployed configuration nor exercises native KEM workers.
          EOF
  ci:
    name: CI passed
    if: always()
    needs: [portable-source-checks, release-contract, browser-checks, metadata-postgresql]
    runs-on: ubuntu-latest
    steps:
      - name: Require every source check
        env:
          SOURCE_RESULT: ${{ needs.portable-source-checks.result }}
          CONTRACT_RESULT: ${{ needs.release-contract.result }}
          BROWSER_RESULT: ${{ needs.browser-checks.result }}
          METADATA_RESULT: ${{ needs.metadata-postgresql.result }}
        run: test "$SOURCE_RESULT" = success && test "$CONTRACT_RESULT" = success && test "$BROWSER_RESULT" = success && test "$METADATA_RESULT" = success
