# Install as /etc/systemd/journald@crucible.conf.
# A separate bounded journal for the app, proxy and backup status.
[Journal]
Storage=persistent
Compress=yes
SystemMaxUse=128M
SystemMaxFileSize=16M
RuntimeMaxUse=32M
MaxRetentionSec=7day
ForwardToSyslog=no
ForwardToKMsg=no
ForwardToConsole=no
RateLimitIntervalSec=30s
RateLimitBurst=200
